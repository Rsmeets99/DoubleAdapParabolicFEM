# Canonical complete runner configuration for non_matching_initial (2+1D).

example: non_matching_initial
dimension: 2
rho: 1.0
max_outer: 200
max_inner: 50
theta_x: 0.4
theta_y: 0.4
uniform_x_refinement: false
p: 1
zero_tol: 1.0e-15
divergence_residual_l2_tolerance: 1.0e-4
eta_squared_stop: 0.0
inner_estimator_squared_stop: 0.0
max_wall_time_seconds: 0.0
max_y_true_dofs: 500000
main_solver: pardiso_ldlt
main_solver_pardiso_memory_mode: in_core
main_solver_max_iterations: 20000
main_solver_tolerance: 1.0e-8
main_solver_symmetry_tolerance: 1.0e-12
main_solver_direct_residual_retry: true
main_solver_direct_residual_retry_tolerance: 1.0e-10
output: algorithm_data/space_time_2d/non_matching_initial_config_run
quiet: false
list_examples: false
help: false
check_divergence_residual: false
stop_on_empty_y_marking: true
use_adaptive_initial_guess: false
solve_main_system_correction: false
export_history: true
save_estimator_components: true
save_refinement_history: true
save_mesh_statistics: true
save_snapshots: false
save_snapshot_dofs: false
enable_timing_breakdown: true
timing_history_filename: timing_history.csv
timing_detail_level: detailed
